<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>결제 링크 관리 | 해드리오</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#121826;--gray:#5B6474;--line:#E3E7EE;--bg:#F5F7FA;--blue:#1F4FE0;--red:#C2362B;--green:#1E7B47;--amber:#8A5A00}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.card h2{margin:0 0 14px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label small{font-weight:400;color:var(--gray)}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #CBD2DC;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.check{flex-direction:row;align-items:center;gap:8px}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid #CBD2DC;background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.msg{font-size:14px;color:var(--gray)}
.msg.err{color:var(--red)}
.warn{color:var(--amber);font-size:13px}
.result{margin-top:14px;padding:14px;border-radius:10px;background:#EEF3FF}
.result code{word-break:break-all;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--gray);font-weight:600}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-open{background:#EEF3FF;color:var(--blue)}
.b-paid{background:#E5F5EC;color:var(--green)}
.b-expired,.b-cancelled,.b-refunded{background:#F0F1F4;color:var(--gray)}
.b-test{background:#FFF4D6;color:var(--amber);margin-left:4px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions button{padding:5px 9px;font-size:13px}
.sub{color:var(--gray);font-size:12px}
.note{color:var(--red);font-size:12px}
[hidden]{display:none!important}
@media (max-width:700px){thead{display:none}tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}td{display:block;border:0;padding:3px 0}td.num{text-align:left}}
</style>
</head>
<body>
<header><h1>결제 링크 관리</h1><div><span class="msg" id="who"></span> <button id="logout" hidden>로그아웃</button></div></header>
<main>
<section class="card" id="login">
<h2>관리자 로그인</h2>
<form id="loginform" class="grid">
<label>이메일<input id="email" type="email" autocomplete="username" required></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
</form>
<div class="row"><button class="primary" type="submit" form="loginform">로그인</button><span class="msg" id="loginmsg"></span></div>
</section>

<div id="app" hidden>
<section class="card">
<h2>새 결제 링크</h2>
<form id="createform">
<div class="grid">
<label>서비스명 <small>고객에게 그대로 보여요. 고객 언어로 써 주세요.</small><input id="title" maxlength="80" required placeholder="Portuguese–Korean interpretation (2 hours)"></label>
<label>금액(원) <small>부가세 포함 최종 금액</small><input id="amount" type="number" min="1000" max="5000000" step="100" required placeholder="450000"><span class="warn" id="amountwarn" hidden>이니시스에 신청한 최고 객단가(50만 원)를 넘어요. 카드사에서 막힐 수 있어요.</span></label>
<label>결제 페이지 언어<select id="lang"><option value="en">English</option><option value="ja">日本語</option><option value="zh-cn">简体中文</option><option value="zh-tw">繁體中文</option><option value="vi">Tiếng Việt</option><option value="th">ไทย</option></select></label>
<label>유효 기간(일)<input id="days" type="number" min="1" max="60" value="7" required></label>
</div>
<div class="grid" style="margin-top:12px">
<label>고객 이름 <small>선택, 미리 채워져요</small><input id="cname" maxlength="60"></label>
<label>고객 이메일 <small>선택</small><input id="cemail" type="email" maxlength="120"></label>
<label>고객 전화 <small>선택, 국가번호 포함</small><input id="cphone" maxlength="30"></label>
</div>
<div class="grid" style="margin-top:12px">
<label>내부 메모 <small>고객에게 안 보여요</small><textarea id="memo" maxlength="500"></textarea></label>
</div>
<div class="row">
<label class="check"><input type="checkbox" id="test">테스트 결제 (이니시스 테스트 채널, 당일 자동 취소)</label>
</div>
<div class="row"><button class="primary" type="submit">링크 만들기</button><span class="msg" id="createmsg"></span></div>
</form>
<div class="result" id="result" hidden>
<div><strong>결제 링크</strong> <code id="resultlink"></code></div>
<div class="row"><button type="button" id="copylink">링크 복사</button><button type="button" id="copymsg">고객 안내 메시지 복사</button><span class="msg" id="copymsgstate"></span></div>
</div>
</section>

<section class="card">
<div class="row" style="margin-top:0;justify-content:space-between"><h2 style="margin:0">결제 링크 목록</h2><button type="button" id="refresh">새로고침</button></div>
<table>
<thead><tr><th>만든 날</th><th>서비스 / 고객</th><th>금액</th><th>상태</th><th>작업</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="msg" id="listmsg"></p>
</section>
</div>
</main>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://sutvnkiroquezjaendkr.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1dHZua2lyb3F1ZXpqYWVuZGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODU3OTEsImV4cCI6MjA5ODM2MTc5MX0.cnxKEJPVWzpiWNhhkQ800cacxp6lGLbiNzGNDSCHcaE';
  var SITE = 'https://www.haedurio.com';
  var FN = SUPABASE_URL + '/functions/v1/pay-order';
  var sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
  var $ = function (id) { return document.getElementById(id); };

  var STATUS = { open: '결제 대기', paid: '결제 완료', expired: '만료', cancelled: '취소', refunded: '환불' };
  var TEMPLATES = {
    en: 'Here is your payment link for {title} ({amount}):\n{link}\nThe link is valid until {date}.',
    ja: '{title}（{amount}）のお支払いリンクです。\n{link}\n有効期限：{date}',
    'zh-cn': '{title}（{amount}）的付款链接：\n{link}\n有效期至：{date}',
    'zh-tw': '{title}（{amount}）的付款連結：\n{link}\n有效期限：{date}',
    vi: 'Đây là liên kết thanh toán cho {title} ({amount}):\n{link}\nLiên kết có hiệu lực đến {date}.',
    th: 'ลิงก์ชำระเงินสำหรับ {title} ({amount}):\n{link}\nใช้ได้ถึง {date}'
  };
  function won(n, lang) {
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'vi' ? '.' : ',');
    return lang === 'vi' ? s + ' ₩' : '₩' + s;
  }
  function link(o) { return SITE + (o.lang === 'en' ? '' : '/' + o.lang) + '/pay/?o=' + o.code; }
  function status(o) { return o.status === 'open' && new Date(o.expires_at) < new Date() ? 'expired' : o.status; }
  function day(d) { return new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function message(o) {
    var date = new Date(o.expires_at).toISOString().slice(0, 10);
    return (TEMPLATES[o.lang] || TEMPLATES.en).replace('{title}', o.title).replace('{amount}', won(o.amount, o.lang)).replace('{link}', link(o)).replace('{date}', date);
  }
  function copy(text, el, done) {
    navigator.clipboard.writeText(text).then(function () { if (el) { el.textContent = done || '복사했어요'; setTimeout(function () { el.textContent = ''; }, 2000); } });
  }
  function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }

  /* ---------- Auth ---------- */
  function setAuthed(session) {
    var on = !!session;
    $('login').hidden = on;
    $('app').hidden = !on;
    $('logout').hidden = !on;
    $('who').textContent = on ? session.user.email : '';
    if (on) load();
  }
  sb.auth.getSession().then(function (r) { setAuthed(r.data.session); });
  sb.auth.onAuthStateChange(function (_e, session) { setAuthed(session); });
  $('loginform').addEventListener('submit', function (e) {
    e.preventDefault();
    $('loginmsg').textContent = '로그인 중…';
    sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value }).then(function (r) {
      $('loginmsg').textContent = r.error ? '로그인 실패: ' + r.error.message : '';
      $('loginmsg').className = r.error ? 'msg err' : 'msg';
    });
  });
  $('logout').addEventListener('click', function () { sb.auth.signOut(); });

  /* ---------- Create ---------- */
  $('amount').addEventListener('input', function () { $('amountwarn').hidden = !(+this.value > 500000); });
  var last = null;
  $('createform').addEventListener('submit', function (e) {
    e.preventDefault();
    var amount = Math.round(+$('amount').value);
    var days = Math.max(1, Math.min(60, Math.round(+$('days').value || 7)));
    var row = {
      title: $('title').value.trim(),
      amount: amount,
      lang: $('lang').value,
      customer_name: $('cname').value.trim() || null,
      customer_email: $('cemail').value.trim() || null,
      customer_phone: $('cphone').value.trim() || null,
      memo: $('memo').value.trim() || null,
      test: $('test').checked,
      expires_at: new Date(Date.now() + days * 864e5).toISOString()
    };
    if (row.title.length < 2 || !(amount >= 1000)) { $('createmsg').textContent = '서비스명과 금액(1,000원 이상)을 확인해 주세요.'; $('createmsg').className = 'msg err'; return; }
    $('createmsg').textContent = '만드는 중…'; $('createmsg').className = 'msg';
    sb.from('pay_orders').insert(row).select('*').single().then(function (r) {
      if (r.error) { $('createmsg').textContent = '실패: ' + r.error.message; $('createmsg').className = 'msg err'; return; }
      last = r.data;
      $('createmsg').textContent = '';
      $('resultlink').textContent = link(last);
      $('result').hidden = false;
      $('createform').reset();
      $('amountwarn').hidden = true;
      load();
    });
  });
  $('copylink').addEventListener('click', function () { if (last) copy(link(last), $('copymsgstate'), '링크를 복사했어요'); });
  $('copymsg').addEventListener('click', function () { if (last) copy(message(last), $('copymsgstate'), '메시지를 복사했어요'); });

  /* ---------- List ---------- */
  function recheck(o, btn) {
    btn.disabled = true; btn.textContent = '확인 중…';
    fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY, apikey: ANON_KEY }, body: JSON.stringify({ action: 'complete', code: o.code, paymentId: o.last_payment_id }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { alertLine(res.ok ? '결제 완료로 확인됐어요.' : '아직 결제되지 않았어요 (' + (res.paymentStatus || res.error) + ').'); load(); })
      .catch(function () { alertLine('확인하지 못했어요. 잠시 뒤 다시 해 주세요.'); btn.disabled = false; btn.textContent = '결제 확인'; });
  }
  function cancel(o, btn) {
    if (!window.confirm('"' + o.title + '" 링크를 취소할까요? 고객은 더 이상 결제할 수 없어요.')) return;
    btn.disabled = true;
    sb.from('pay_orders').update({ status: 'cancelled' }).eq('id', o.id).eq('status', 'open').then(function (r) {
      if (r.error) alertLine('취소 실패: ' + r.error.message);
      load();
    });
  }
  function alertLine(text) { $('listmsg').textContent = text; }

  function load() {
    $('listmsg').textContent = '불러오는 중…';
    sb.from('pay_orders').select('*').order('created_at', { ascending: false }).limit(100).then(function (r) {
      var tbody = $('rows');
      tbody.textContent = '';
      if (r.error) { $('listmsg').textContent = '불러오기 실패: ' + r.error.message; return; }
      $('listmsg').textContent = r.data.length ? '' : '아직 만든 결제 링크가 없어요.';
      r.data.forEach(function (o) {
        var st = status(o);
        var tr = document.createElement('tr');
        var c1 = el('td', day(o.created_at)); c1.appendChild(el('div', o.code.toUpperCase(), 'sub'));
        var c2 = el('td'); c2.appendChild(el('div', o.title));
        var who = [o.customer_name, o.customer_email, o.customer_phone].filter(Boolean).join(' · ');
        if (who) c2.appendChild(el('div', who, 'sub'));
        if (o.memo) c2.appendChild(el('div', '메모: ' + o.memo, 'sub'));
        if (o.last_error) c2.appendChild(el('div', o.last_error, 'note'));
        var c3 = el('td', won(o.amount, 'ko'), 'num');
        var c4 = el('td'); c4.appendChild(el('span', STATUS[st] || st, 'badge b-' + st));
        if (o.test) c4.appendChild(el('span', '테스트', 'badge b-test'));
        if (o.paid_at) c4.appendChild(el('div', day(o.paid_at), 'sub'));
        var c5 = el('td'); var acts = el('div', null, 'actions'); c5.appendChild(acts);
        var b1 = el('button', '링크 복사'); b1.type = 'button'; b1.onclick = function () { copy(link(o), b1, '복사됨'); setTimeout(function () { b1.textContent = '링크 복사'; }, 1500); }; acts.appendChild(b1);
        var b2 = el('button', '메시지 복사'); b2.type = 'button'; b2.onclick = function () { copy(message(o), b2, '복사됨'); setTimeout(function () { b2.textContent = '메시지 복사'; }, 1500); }; acts.appendChild(b2);
        if (st !== 'paid' && o.last_payment_id) { var b3 = el('button', '결제 확인'); b3.type = 'button'; b3.onclick = function () { recheck(o, b3); }; acts.appendChild(b3); }
        if (o.status === 'open') { var b4 = el('button', '취소', 'danger'); b4.type = 'button'; b4.onclick = function () { cancel(o, b4); }; acts.appendChild(b4); }
        [c1, c2, c3, c4, c5].forEach(function (c) { tr.appendChild(c); });
        tbody.appendChild(tr);
      });
    });
  }
  $('refresh').addEventListener('click', load);
})();
</script>
</body>
</html>
